    <script>
      // Check local storage for theme to prevent white flash
      const theme = localStorage.getItem('theme');
      if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      }
    </script>
    <style>
      #app-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        background: #ffffff;
        color: #0a0a0a;
        font-family: 'Geist Variable', system-ui, -apple-system, sans-serif;
        z-index: 9999;
      }
      /* Controlled by the .dark class now */
      html.dark #app-splash { background: #0a0a0a; color: #fafafa; }
      
      #app-splash .ring-wrap {
        position: relative;
        width: 80px;
        height: 80px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #app-splash .ring,
      #app-splash .ring-pulse {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 2px solid currentColor;
        opacity: 0.2;
      }
      #app-splash .ring-pulse {
        animation: splash-ping 1.6s cubic-bezier(0, 0, 0.2, 1) infinite;
        opacity: 0.4;
      }
      #app-splash svg {
        width: 40px;
        height: 40px;
        animation: splash-rock 2s ease-in-out infinite;
      }
      #app-splash .label {
        font-size: 14px;
        font-weight: 500;
        letter-spacing: 0.04em;
      }
      #app-splash .sub {
        font-size: 12px;
        opacity: 0.6;
        margin-top: -14px;
      }
      #app-splash .dots span {
        display: inline-block;
        animation: splash-dot 1.4s ease-in-out infinite;
      }
      #app-splash .dots span:nth-child(2) { animation-delay: 0.2s; }
      #app-splash .dots span:nth-child(3) { animation-delay: 0.4s; }
      @keyframes splash-ping {
        0%   { transform: scale(1);   opacity: 0.4; }
        80%, 100% { transform: scale(1.8); opacity: 0; }
      }
      @keyframes splash-rock {
        0%, 100% { transform: rotate(-8deg) translateY(0); }
        50%      { transform: rotate(8deg)  translateY(-2px); }
      }
      @keyframes splash-dot {
        0%, 80%, 100% { opacity: 0.2; }
        40%           { opacity: 1; }
      }
    </style>
